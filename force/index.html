<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>龙门架实时受力分析</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="dot"></span>
    <h1>龙门架实时受力分析</h1>
    <span class="tag" id="srcTag">鼠标模拟</span>
  </div>
  <div class="modes">
    <button class="mode-btn active" data-mode="A">模式 A · 一人两绳（力的分解）</button>
    <button class="mode-btn" data-mode="B">模式 B · 两人互拉（相互作用力）</button>
  </div>
</header>

<main class="layout">

  <section class="stage-wrap">
    <div class="stage" id="stage">
      <canvas id="scene"></canvas>
      <div class="hint" id="hint">拖动<b>滑轮</b>或<b>人</b>，观察受力变化</div>
      <div class="warn" id="warn" hidden></div>
    </div>

    <!-- 摄像头画面：点选滑轮时看，平时可收起 -->
    <div class="stage camwrap" id="camwrap" hidden>
      <video id="cam" playsinline muted></video>
      <canvas id="camoverlay"></canvas>
      <div class="hint" id="camhint">先点右侧按钮，然后在画面上点两个滑轮</div>
    </div>
  </section>

  <aside class="panel">

    <div class="card">
      <h2>实时数据</h2>
      <div id="readout"></div>
    </div>

    <div class="card">
      <h2>数据来源</h2>
      <div class="seg">
        <button class="seg-btn active" data-src="mouse">鼠标模拟</button>
        <button class="seg-btn" data-src="camera">摄像头</button>
      </div>
      <div id="camStatus" class="status" hidden></div>
      <div id="camPicker" hidden>
        <label class="ctl"><span>用哪个摄像头</span>
          <select id="camSelect"></select></label>
        <div id="camDiag" class="diag">未启动</div>
      </div>
      <div id="camPanel" hidden>
        <div id="calibState" class="status warnbox">还没点滑轮</div>
        <button class="reset" id="pickBtn">在画面上点两个滑轮</button>
        <p class="sub">滑轮被推动之后，重新点一次就行。人的位置全自动跟踪。</p>
        <label class="chk"><input type="checkbox" id="showCam" checked> 显示摄像头画面</label>
      </div>
    </div>

    <div class="card">
      <h2>参数</h2>

      <label class="ctl" data-mode="A">
        <span>学生体重</span>
        <input type="range" id="massA" min="15" max="90" step="1" value="35">
        <output id="massAOut">35 kg</output>
      </label>

      <label class="ctl" data-mode="B" hidden>
        <span>左侧学生体重</span>
        <input type="range" id="massB1" min="15" max="90" step="1" value="40">
        <output id="massB1Out">40 kg</output>
      </label>

      <label class="ctl" data-mode="B" hidden>
        <span>右侧学生体重</span>
        <input type="range" id="massB2" min="15" max="90" step="1" value="28">
        <output id="massB2Out">28 kg</output>
      </label>

      <button class="reset" id="reset">恢复初始位置</button>
    </div>


  </aside>
</main>

<script src="physics.js"></script>
<script src="app.js"></script>
<script src="vision.js"></script>
<script src="wire.js"></script>
</body>
</html>
