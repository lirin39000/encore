name: Daily show scrape

on:
  schedule:
    # UTC 00:00 = 北京时间 08:00。挪到早上是因为流程最后一步会给订阅用户发提醒邮件，
    # 原来半夜 0 点跑，邮件就半夜到，手机开了邮件提醒的人会被吵醒
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      # 补跑积压数据时用。补跑会把断档期间的演出一次性入库，first_seen 全是当天，
      # 自动推送会判定它们"26 小时内新上"而按常规格式群发。想改成一封带说明的
      # 补发信时，就勾上这个，让这次跑完不发信、也不写 notify_log(两者在
      # notify_new_shows.py 里是绑定的：不发就不记，所以之后补发不会漏)
      skip_email:
        description: "这次不发提醒邮件（补跑积压数据时勾上）"
        type: boolean
        default: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 最后那步"续命"要往仓库推一个提交，默认令牌在新仓库里是只读的，得显式开写权限
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 续命提交用这个令牌推。优先用 KEEPALIVE_TOKEN(你自己的个人令牌)：
          # GitHub 官方没承诺机器人(GITHUB_TOKEN)的提交算"仓库活动"，个人令牌的提交
          # 跟你本人提交没区别，一定算。没配这个 secret 时自动退回默认令牌——
          # 大概也有效，只是没保证
          token: ${{ secrets.KEEPALIVE_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Install wx cloud sync dependencies
        working-directory: backend/scraper/sync_to_wx_cloud
        run: npm install

      - name: Run daily pipeline
        working-directory: backend/scraper
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          AMAP_WEB_SERVICE_KEY: ${{ secrets.AMAP_WEB_SERVICE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WX_CLOUD_ENV: "cloud1-d9gwsf1jq9b490005"
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          # 邮件推送用。这两个都不是密钥：一个是发信地址，一个是邮件里验证/退订链接的
          # 基址(必须是外网可达的后端地址)。缺了的话推送那步会静默跳过，不报错
          # 置空 = notify_new_shows 里 aliyun_dm.is_configured() 为假，那一步直接跳过
          ALIYUN_DM_ACCOUNT_NAME: ${{ inputs.skip_email && '' || 'notice@mail.encore.monster' }}
          SITE_BASE_URL: "https://encore-production-cbe3.up.railway.app"
          # 推送有邮件发失败时，往这个地址发一封纯文本预警。这个流程没人盯日志，
          # 不报警的话出问题只能等用户来问。不是密钥，就是你自己的收件邮箱
          ADMIN_ALERT_EMAIL: "lirin3900@gmail.com"
          # 阿里云反垃圾团队 2026-07-21 人工加白了发信域名，富文本版不再被拦，换回好看的 HTML 版。
          # 万一以后又被拦，改回 text 即可
          EMAIL_NOTIFY_MODE: "html"
        run: python daily_pipeline.py

      # GitHub 的规则：仓库 60 天没有新提交，定时任务就被自动停用。2026-10-21 已经
      # 被停过一次(最后一次提交是 8-22)，数据断了 7 天才发现——下游全是静默的：
      # 没有新演出、小程序数据不动、邮件不发，但后端 /health 一切正常，看不出来。
      # 所以每次跑完往仓库写一个时间戳，把这个 60 天计时器推回去。
      #
      # if: always() 是关键：前面步骤失败时也必须跑。否则抓取要是连续坏 60 天，
      # 续命也跟着不执行，定时任务又被静默停用——一个故障变成两个，而且第二个
      # 更难发现。这一步失败会让整个 run 变红，GitHub 会给你发失败邮件，正好当报警
      #
      # 只在"已经 50 天没提交"时才提交，不是每天都提：平时你自己改代码就算活动了，
      # 没必要往历史里塞 365 个无意义的提交
      - name: 续命——把定时任务的 60 天计时器推回去
        if: always()
        run: |
          quiet_days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "距离仓库上一次提交 ${quiet_days} 天（60 天就会被停用）"
          if [ "$quiet_days" -lt 50 ]; then
            echo "还没到 50 天，不用提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date -u "+%Y-%m-%dT%H:%M:%SZ" > .github/keepalive.txt
          git add .github/keepalive.txt
          git commit -m "Keep the daily scrape schedule from being auto-disabled"
          git push
          echo "已提交时间戳，60 天计时器重新开始"
